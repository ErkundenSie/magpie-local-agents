<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Local CLI</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="terminal-mark" aria-hidden="true">›_</span>
        <h1 data-i18n="appTitle">Local CLI</h1>
      </div>
      <div class="connection">
        <div class="connection-status" id="connection-status" role="status" data-state="idle">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="connection-label">未连接</span>
        </div>
        <button class="button button-retry" id="retry-button" type="button" hidden data-i18n="retry">重新连接</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-labelledby="settings-heading">
        <h2 id="settings-heading" data-i18n="settings">会话设置</h2>
        <fieldset class="agent-picker">
          <legend data-i18n="agent">代理</legend>
          <div class="agent-list" id="agent-list"></div>
        </fieldset>
        <div class="workspace-field">
          <label for="workspace" data-i18n="workspace">工作区路径</label>
          <input id="workspace" type="text" maxlength="32767" autocomplete="off" spellcheck="false" aria-describedby="workspace-note" data-i18n-placeholder="workspacePlaceholder" placeholder="使用本机主目录">
          <p class="field-note" id="workspace-note" data-i18n="workspaceHelp">输入绝对路径，或留空使用本机主目录。</p>
        </div>
      </aside>

      <section class="conversation" aria-labelledby="chat-title">
        <header class="conversation-header">
          <div class="conversation-heading">
            <h2 id="chat-title" data-i18n="conversation">对话</h2>
            <div class="conversation-meta">
              <span id="active-agent">Codex</span>
              <span id="session-label" class="session-label" hidden></span>
            </div>
          </div>
          <button class="button button-quiet" id="reset-button" type="button" disabled data-i18n="reset">重置对话</button>
        </header>

        <div class="transcript" id="transcript" tabindex="0" role="region" aria-labelledby="chat-title">
          <div class="empty-state" id="empty-state">
            <span class="terminal-mark empty-mark" aria-hidden="true">›_</span>
            <h3 data-i18n="emptyTitle">开始本地对话</h3>
            <p data-i18n="emptyHelp">选择代理和工作区，发送消息以启动本地 CLI。</p>
          </div>
          <div class="entries" id="entries"></div>
        </div>

        <footer class="composer-area">
          <p class="notice" id="notice" role="status" hidden></p>
          <div class="composer">
            <label class="sr-only" for="prompt" data-i18n="message">消息</label>
            <textarea id="prompt" rows="3" maxlength="32000" data-i18n-placeholder="promptPlaceholder" placeholder="输入消息…"></textarea>
            <div class="composer-footer">
              <span class="shortcut" data-i18n="shortcut">Enter 发送 · Shift + Enter 换行</span>
              <div class="composer-actions">
                <button class="button button-stop" id="stop-button" type="button" hidden data-i18n="stop">停止</button>
                <button class="button button-primary" id="send-button" type="button" disabled data-i18n="send">发送</button>
              </div>
            </div>
          </div>
        </footer>
      </section>
    </main>
  </div>
</body>
</html>
